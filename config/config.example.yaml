# =====================================================================
#  Weather station – configuration
#  Save this file as config/config.yaml (it is mounted at /config).
#  Values like ${HA_TOKEN} are filled in from environment variables;
#  ${NAME:-default} sets a default value.
#  Changes take effect after the container restarts.
# =====================================================================

# ---------------------------------------------------------------------
# Station – shown publicly (header, browser tab, history page)
#
# Name, subtitle, altitude, commissioning date and the device list can also
# be set on the admin page when they are left out here (devices: as a whole,
# not device by device).
# ---------------------------------------------------------------------
station:
  # Name, subtitle, altitude and commissioning date are commented out so they
  # stay editable on the admin page. A value set here is locked there.
  # name: My Weather Station                 # browser tab, header, name of the app on a home screen; default "Weather Station"
  # subtitle: WH90 + WH57 via Home Assistant # small line in the header; none by default
  # altitude_m: 312                          # height above sea level; not shown by default
  # since: 2024-04-01                        # commissioning date, start of the records; default: the last 10 years
  # timezone: Europe/Berlin                  # optional, otherwise the time zone from Home Assistant

  # Server-side only, for sunrise/sunset and the moon. NEVER sent to the
  # browser. If left out, the coordinates from Home Assistant are used.
  # latitude: 50.1
  # longitude: 8.7

  # Devices: for the sensor details on the history page.
  # metrics: which readings come from this device
  #   temp, hum, wind, rain, press, solar, uv, light
  # battery / signal: any HA entities (optional)
  devices:
    - id: wh90
      name: Ecowitt WH90
      short: WH90
      role: Outdoor sensor
      battery: sensor.wh90_battery
      signal: sensor.wh90_signal_strength
      metrics: [temp, hum, wind, rain, solar, uv]
    - id: wh57
      name: Ecowitt WH57
      short: WH57
      role: Lightning sensor
      battery: sensor.wh57_battery
      signal: sensor.wh57_signal_strength
      metrics: [light]
    - id: gateway
      name: Ecowitt GW2000
      short: Gateway
      role: Gateway
      metrics: [press]

# ---------------------------------------------------------------------
# Data source: Home Assistant (default) or the Ecowitt gateway directly
#
# If not set, Home Assistant is used when its URL and token are set,
# otherwise the Ecowitt gateway when ecowitt.host is set. Can also be chosen
# on the admin page.
# ---------------------------------------------------------------------
# source: ecowitt           # homeassistant | ecowitt

# Ecowitt gateway directly (GW1100, GW2000, GW3000, WS3900, … with current
# firmware), without Home Assistant. The station reads the gateway's local
# HTTP API (/get_livedata_info), detects the sensors itself and keeps the
# history in DATA_DIR/ecowitt (raw readings for keep_raw_days days, hourly
# values forever). `sensors:` below is not needed then; if present, it only
# limits which readings are shown.
# Without Home Assistant there is no time zone or location to take from it:
# set station.timezone (or TZ) and station.latitude/longitude.
# ecowitt:
#   host: ${ECOWITT_HOST:-192.168.1.50}   # IP address or host name of the gateway
#   poll_seconds: 30        # how often the gateway is read
#   rain_gauge: auto        # auto | piezo | tipping (auto: piezo if there is one)
#   pressure: relative      # relative | absolute
#   keep_raw_days: 10       # how long the raw readings (day charts) are kept

# ---------------------------------------------------------------------
# Home Assistant – stays on the server, never reaches the browser
#
# Instead of this file, the URL, token, sensor entities and the DWD station
# ID can also be set on the admin page (/#/admin, default admin/admin, the
# password has to be changed at the first sign-in). What is set here in
# config.yaml always wins: the admin page can only set fields that are empty
# or left out here.
# ---------------------------------------------------------------------
homeassistant:
  url: ${HA_URL:-http://homeassistant.local:8123}
  token: ${HA_TOKEN}     # long-lived access token (Profile → Security)

# ---------------------------------------------------------------------
# Sensors – entity IDs from Home Assistant
# (Developer tools → States). Leave out or comment out sensors you don't
# have, and their readings disappear from the dashboard; or set them on the
# admin page instead (see above).
# Units are converted automatically (°F, mph, inHg, in … are fine).
# ---------------------------------------------------------------------
sensors:
  temperature: sensor.wh90_outdoor_temperature
  feels_like: sensor.wh90_feels_like_temperature
  dew_point: sensor.wh90_dewpoint
  humidity: sensor.wh90_outdoor_humidity

  wind_speed: sensor.wh90_wind_speed
  wind_gust: sensor.wh90_wind_gust
  wind_direction: sensor.wh90_wind_direction     # degrees 0–360

  rain_rate: sensor.wh90_rain_rate_piezo         # mm/h
  rain_event: sensor.wh90_event_rain_piezo
  rain_daily: sensor.wh90_daily_rain_piezo       # daily counter, needed for the rain charts
  # Optional – without these, week/month/year are calculated from the statistics:
  rain_weekly: sensor.wh90_weekly_rain_piezo
  rain_monthly: sensor.wh90_monthly_rain_piezo
  rain_yearly: sensor.wh90_yearly_rain_piezo

  pressure: sensor.gateway_relative_pressure
  solar_radiation: sensor.wh90_solar_radiation
  uv_index: sensor.wh90_uv_index

  lightning_distance: sensor.wh57_lightning_distance
  lightning_time: sensor.wh57_lightning_time     # time of the last strike
  lightning_count: sensor.wh57_lightning_strikes # daily strike counter

# ---------------------------------------------------------------------
# Forecast
#
# First choice: DWD MOSMIX (ICON model plus statistical post-processing) for
# a DWD station you set here. The next ~6 hours are matched to the current
# live reading (bias_hours); the days after stay unchanged MOSMIX. "entity"
# remains as a fallback if dwd_station_id is not set or DWD is unreachable.
# ---------------------------------------------------------------------
forecast:
  dwd_station_id: "10384"   # DWD station ID, e.g. "10384" or "L771". Easiest to pick on the map on the admin page.
  # bias_hours: 6            # for how many hours the live reading corrects the forecast
  entity: weather.forecast_home   # fallback if dwd_station_id is empty or unreachable
  # label: DWD MOSMIX        # source credit shown with the forecast; otherwise from "attribution" or a default text
  days: 5

# ---------------------------------------------------------------------
# Alerts – read-only in the browser, defined here or on the admin page.
#
# Leave "alerts:" out to use the built-in rules (lightning nearby, frost,
# gale-force gusts, heavy rain, high UV index), which every visitor reads in
# their own language, and to manage the rules on the admin page. Setting
# "alerts:" here (even empty) always wins; "alerts: []" turns alerts off.
#
# Each rule: all: (every condition) or any: (at least one).
# Condition: sensor: <key from "sensors"> OR entity: <HA entity>
#   comparison: above / below / at_least / at_most / equals
#   recent: { sensor: lightning_time, minutes: 30 }  → only while fresh
# Values in standard units: °C, km/h, hPa, mm, mm/h, km.
# message: placeholders {sensor_key}, {…|time}, {…|compass}
# level: warning (amber) or info (blue)
# label, description, banner and message are shown as written, or can be
# given once per language: label: { en: Frost, de: Frost }
# ---------------------------------------------------------------------
alert_settings:
  clear_after_minutes: 10   # how long a rule must be off before its alert ends

# alerts:
#   - id: frost
#     label: Frost
#     description: Temperature below 0 °C or dew point below 1 °C
#     banner: Risk of frost
#     level: info
#     any:
#       - { sensor: temperature, below: 0 }
#       - { sensor: dew_point, below: 1 }
#     message: "Temperature {temperature} °C · dew point {dew_point} °C"
#
#   # Example with any HA entity:
#   - id: wh90_battery
#     label: WH90 battery
#     description: Supercapacitor below 2.4 V
#     level: info
#     all:
#       - { entity: sensor.wh90_battery, below: 2.4 }
#     message: "Voltage {sensor.wh90_battery} V"

# ---------------------------------------------------------------------
# Interface
# ---------------------------------------------------------------------
ui:
  refresh_seconds: 15        # how often the browser fetches new readings
  stale_after_seconds: 120   # after this the live dot turns amber ("stale")
  default_units:             # default for new visitors; everyone can change their own
    temperature: °C          # °C | °F
    wind: km/h               # km/h | m/s | mph | Bft
    pressure: hPa            # hPa | mmHg | inHg
    rain: mm                 # mm | l/m² | in

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server:
  port: 47813
  demo: false                # true = synthetic data, Home Assistant is not contacted
  cache:
    live_seconds: 15
    history_seconds: 300
    records_seconds: 3600
