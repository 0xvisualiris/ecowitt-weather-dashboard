services:
  wetterstation:
    build: .
    image: wetterstation:latest
    container_name: wetterstation
    restart: unless-stopped
    ports:
      - "47813:47813"
    environment:
      # Long-lived access token from Home Assistant (Profile → Security)
      HA_TOKEN: ${HA_TOKEN}
      # Optional: overrides homeassistant.url from config.yaml
      # HA_URL: http://192.168.1.10:8123
      TZ: Europe/Berlin
    volumes:
      - ./config:/config:ro          # holds config.yaml
      - wetterstation-data:/data     # alert log, admin settings, Ecowitt history

volumes:
  wetterstation-data:
